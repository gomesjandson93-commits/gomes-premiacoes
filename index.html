<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gomes Premiações — Demo</title>
<style>
body{background:#101010;color:#eee;font:16px system-ui;margin:0}
main{max-width:650px;margin:auto;padding:20px}
header{text-align:center}
h1,h2,strong{color:#e6bd65}
section{background:#202020;border:1px solid #51442d;border-radius:14px;padding:18px;margin:15px 0}
button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #78643e;margin:4px}
button{background:#e6bd65;color:#111;cursor:pointer;font-weight:bold}
input{background:#111;color:white;max-width:85%}
small{color:#bbb}
.ticket{display:inline-block;padding:6px;margin:3px;background:#333;border-radius:5px}
.win{background:#e6bd65;color:#111}
progress{width:100%;accent-color:#e6bd65}
</style>
</head>
<body>
<main>
<header>
<h1>♛ GOMES PREMIAÇÕES</h1>
<p>Sua sorte começa aqui</p>
<small>DEMONSTRAÇÃO — SEM PAGAMENTOS OU PRÊMIOS REAIS</small>
</header>

<section>
<h2>Conexão com Supabase</h2>
<p id="conexao">Verificando conexão...</p>
<button id="testar">Testar conexão</button>
</section>

<section>
<small>PRÊMIO FICTÍCIO</small>
<h1>R$ 2.000,00</h1>
<progress id="progress" max="10000" value="0"></progress>
<p id="count"></p>
</section>

<section>
<h2>Simular participação</h2>
<div id="choices"></div>
<label>Quantidade
<input id="qty" type="number" min="1" max="500" value="20">
</label>
<p id="total"></p>
<button id="go">Gerar cotas gratuitas de teste</button>
<p id="msg" role="status"></p>
</section>

<section>
<h2>Cotas premiadas fictícias</h2>
<div id="prizes"></div>
</section>

<section>
<h2>Minhas cotas</h2>
<div id="history"></div>
</section>

<section>
<h2>Painel demonstrativo</h2>
<p id="stats"></p>
<small>Sem autenticação; dados deste navegador apenas.</small>
<br>
<button id="reset">Limpar testes</button>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const key = 'gomes-demo-v1';
const prizes = [125,1450,3870,5920,8945];

let records = [];

try {
 records = JSON.parse(localStorage.getItem(key) || '[]');
} catch {}

const fmt = n => String(n).padStart(4,'0');

function save(){
 try {
 localStorage.setItem(key,JSON.stringify(records));
 } catch {
 $('msg').textContent = 'Armazenamento local indisponível.';
 }
}

function render(){
 const used = new Set(records.flat());

 $('progress').value = used.size;
 $('count').textContent = used.size + ' / 10.000 cotas simuladas';

 $('prizes').textContent = prizes.map(n =>
 fmt(n) + ' — ' + (used.has(n) ? 'Encontrada' : 'Disponível')
 ).join(' | ');

 $('history').replaceChildren();

 for(const r of records){
 const p = document.createElement('p');
 p.textContent = r.length + ' cotas • ' +
 r.filter(n => prizes.includes(n)).length +
 ' premiadas fictícias';

 $('history').append(p);

 for(const n of r){
 const s = document.createElement('span');
 s.className = 'ticket' + (prizes.includes(n) ? ' win' : '');
 s.textContent = fmt(n);
 $('history').append(s);
 }
 }

 $('stats').textContent = records.length +
 ' participações; ' + (10000-used.size) +
 ' cotas restantes.';
}

function total(){
 $('total').textContent = 'Valor ilustrativo: R$ ' +
 $('qty').value + ',00 (sem cobrança)';
}

for(const n of [10,20,50,100,200,500]){
 const b = document.createElement('button');
 b.textContent = n;
 b.onclick = () => {
 $('qty').value = n;
 total();
 };
 $('choices').append(b);
}

$('qty').oninput = total;

$('go').onclick = () => {
 const q = Number($('qty').value);
 const used = new Set(records.flat());
 const pool = Array.from({length:10000},(_,i)=>i)
 .filter(n=>!used.has(n));

 if(!Number.isInteger(q)||q<1||q>500||q>pool.length){
 $('msg').textContent = 'Quantidade inválida ou indisponível.';
 return;
 }

 const r = [];

 for(let i=0;i<q;i++){
 const j = Math.floor(Math.random()*pool.length);
 r.push(pool[j]);
 pool[j] = pool[pool.length-1];
 pool.pop();
 }

 records.push(r);
 $('msg').textContent = 'Participação simulada registrada.';
 save();
 render();
};

$('reset').onclick = () => {
 if(confirm('Apagar todas as participações locais?')){
 records = [];
 save();
 render();
 }
};

total();
render();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
async function testarConexao(){
 const status = document.getElementById('conexao');
 status.textContent = 'Verificando conexão...';

 try {
 const cliente = window.supabase.createClient(
 'https://vggbtsfnexvhxkzwbgnv.supabase.co',
 'sb_publishable_yK4zyy6yzYB_bs7wiSWBJg_VmCB8L4A'
 );

 const {data,error} = await cliente
 .from('campanhas')
 .select('id')
 .limit(1);

 if(error) throw error;

 status.style.color = '#4ade80';
 status.textContent = 'Supabase conectado! Registros visíveis: ' + data.length;

 } catch(erro){
 status.style.color = '#f87171';
 status.textContent = 'Erro: ' + erro.message;
 }
}

document.getElementById('testar').onclick = testarConexao;
testarConexao();
</script>
</body>
  </html>
